[package]
name = "overcast"
version = "0.1.0"
edition = "2024"

[lints.rust]
warnings = "deny"

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
getrandom = "0.4.3"
httpdate = "1.0.3"
humantime = "2.4.0"
icu_properties = "2.4.0"
ipnetwork = { version = "0.21.1", features = ["serde"] }
maxminddb = "0.32.0"
ml-dsa = "0.1.1"
ml-kem = "0.3.4"
percent-encoding = "2.3.2"
prost = "0.14.4"
regex-automata = "0.4.18"
regex-syntax = "0.8.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
termina = "0.4.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = { version = "3.5.0", features = ["socks-proxy"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde", "v4", "v5"] }
varisat = "0.2.2"
x25519-dalek = "3.0.0"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2"] }

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["sched", "user"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Threading"] }
