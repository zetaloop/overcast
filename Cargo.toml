[package]
name = "overcast"
version = "0.1.0"
edition = "2024"

[lints.rust]
warnings = "deny"

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
getrandom = "0.4.3"
httpdate = "1.0.3"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
tempfile = "3.27.0"
termina = "0.4.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = { version = "3.5.0", features = ["socks-proxy"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2"] }

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["user"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
