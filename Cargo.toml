[package]
name = "overcast"
version = "0.1.0"
edition = "2024"

[lints.rust]
warnings = "deny"

[dependencies]
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
termina = "0.4.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["user"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
