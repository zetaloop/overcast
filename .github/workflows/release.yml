name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: What to do with the built binaries
        type: choice
        options: [dryrun, draft]
        default: dryrun

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup update --no-self-update stable
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings

  build:
    needs: check
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04-arm
    env:
      # Windows binaries carry the C runtime so the single executable runs without the VC++ redistributable.
      RUSTFLAGS: ${{ contains(matrix.target, '-windows-') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup update --no-self-update stable
          rustup component add clippy
          rustup target add ${{ matrix.target }}
      - name: Install musl
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Clippy
        if: runner.os != 'Linux'
        run: cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Rename binary
        run: |
          suffix=${{ runner.os == 'Windows' && '.exe' || '' }}
          mkdir dist
          cp "target/${{ matrix.target }}/release/overcast$suffix" "dist/overcast-${{ matrix.target }}$suffix"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Release tag
        id: tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=$(git tag --points-at HEAD --list 'v*' | head -1)
          fi
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match the package version $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        if: steps.tag.outputs.tag != '' && (github.event_name == 'push' || inputs.mode == 'draft')
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" dist/* --verify-tag --draft --title "$TAG" --generate-notes
